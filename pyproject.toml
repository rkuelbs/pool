[project]
name = "poolctl"
version = "0.1.0"
description = "Raspberry Pi pool automation controller"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

api = [
    "fastapi",
    "uvicorn[standard]",
]

mqtt = [
    "paho-mqtt",
]

raspberrypi = [
    "gpiozero",
    "smbus2",
    "adafruit-circuitpython-ads1x15",
    "pymodbus>=3",
]

[project.scripts]
poolctl = "poolctl.main:main"
poolctl-modbus-bringup = "poolctl.tools.modbus_bringup:main"
poolctl-modbus-device-config = "poolctl.tools.modbus_device_config:main"
poolctl-dfrobot-device-config = "poolctl.tools.dfrobot_device_config:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: tests that require real Raspberry Pi hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
