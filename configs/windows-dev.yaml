runtime:
  stage: windows_simulation
  driver_profile: simulated
  enabled_layers:
  - acquisition
  - logging
  - pump_timer
  - safety_enforcement
  enabled_actuators:
  - pump_motor
  - pump_motor_speed
  - booster_pump
  - chlorine_dosing_pump
  enabled_sensor_groups:
  - pressures
  - chemistry_loop
  - chemical_tank
pump_timer:
  timezone: America/Chicago
  schedules:
  - name: morning_filter
    start: 08:00
    end: '12:00'
    pump_speed: high
    booster: 'off'
  - name: afternoon_filter
    start: '15:00'
    end: '18:00'
    pump_speed: low
    booster: 'off'
  - name: night_clean
    start: '20:00'
    end: '23:00'
    pump_speed: high
    booster: 'on'
safety:
  pressure_sensor_ids:
    pump_output: pump_output_psi
    return_line: return_psi
    booster: booster_psi
  freeze_protection:
    enabled: true
    source: temp
    temp_sensor: temp
    ph_temp_sensor: orp_temp
    low_speed_on_below_temp: 35
    low_speed_off_above_temp: 37
    high_speed_on_below_temp: 33
    high_speed_off_above_temp: 34
    min_run_seconds: 600
    threshold_unit: degF
  thresholds:
    chlorine_min_return_psi: 2
    chlorine_min_pump_output_psi: 6
    booster_max_psi: 60
    booster_min_psi: 30
    pump_low_prime_min_output_psi: 1
    pump_output_overpressure_psi: 30
    pump_high_prime_min_output_psi: 5
  timeouts:
    booster_low_pressure_grace_s: 10
    pump_low_prime_seconds: 30
    pump_high_prime_timeout_s: 30
logging:
  database_path: data\windows-dev.sqlite3
mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  keepalive_s: 30
  client_id: poolctl-windows
  topic_prefix: poolctl
  command_topic: command/set
  lab_test_topic: lab_test/add
  publish_live_topic: telemetry/live
  publish_health_topic: telemetry/health
  qos: 0
  retain: false
  publish_live: true
  publish_health: true
  allow_remote_commands: false
  allow_remote_lab_tests: true
acquisition:
  groups:
    pressures:
      sensor_ids:
      - pump_output_psi
      - filter_output_psi
      - return_psi
      - bubbler_psi
      - booster_psi
      read_interval_s: 0.5
      log_interval_s: 30
      requires_pump_flow: false
      min_pump_on_seconds: 0
      required_pump_speed: null
      oversample:
        sample_count: 3
        sample_interval_s: 0
        reducer: median
    chemistry_loop:
      sensor_ids:
      - raw_orp
      - orp_temp
      - raw_ph
      - raw_ph_voltage
      - temp
      read_interval_s: 5
      log_interval_s: 120
      requires_pump_flow: true
      min_pump_on_seconds: 60
      required_pump_speed: null
      oversample:
        sample_count: 10
        sample_interval_s: 0.1
        reducer: median
    chemical_tank:
      sensor_ids:
      - tank_level
      read_interval_s: 30
      log_interval_s: 300
      requires_pump_flow: false
      min_pump_on_seconds: 0
      required_pump_speed: null
      oversample:
        sample_count: 3
        sample_interval_s: 0
        reducer: median
  chemistry_sampling_refresh:
    enabled: true
    max_pump_off_s: 3600
    run_duration_s: 90
    pump_speed: high
live_view:
  sensor_limits:
    pump_output_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 25.0
      caution_max: 30.0
    filter_output_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 25.0
      caution_max: 30.0
    return_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 18.0
      caution_max: 25.0
    bubbler_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 18.0
      caution_max: 25.0
    booster_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 55.0
      caution_max: 60.0
    raw_orp:
      caution_min: 400.0
      normal_min: 600.0
      normal_max: 800.0
      caution_max: 900.0
    orp_temp:
      caution_min: 35.0
      normal_min: 65.0
      normal_max: 90.0
      caution_max: 100.0
    raw_ph:
      caution_min: 6.8
      normal_min: 7.2
      normal_max: 7.8
      caution_max: 8.2
    raw_ph_voltage:
      caution_min: 0.0
      normal_min: 0.2
      normal_max: 4.8
      caution_max: 5.0
    temp:
      caution_min: 35.0
      normal_min: 65.0
      normal_max: 90.0
      caution_max: 100.0
    tank_level:
      caution_min: 5.0
      normal_min: 20.0
      normal_max: 100.0
      caution_max: 100.0
    calcium_saturation_index:
      caution_min: -0.6
      normal_min: -0.3
      normal_max: 0.3
      caution_max: 0.6
calcium_saturation_index:
  enabled: true
  temp_sensor_id: temp
  ph_sensor_id: raw_ph
modbus_analog_input:
  port: COM3
  slave_id: 4
  baudrate: 9600
  timeout_s: 1.0
  raw_to_volts_scale: 0.001
  raw_to_volts_offset: 0.0
  sensors:
    pump_output_psi:
      channel: 1
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 30.0
    filter_output_psi:
      channel: 2
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 30.0
    return_psi:
      channel: 3
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 20.0
    bubbler_psi:
      channel: 4
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 20.0
    booster_psi:
      channel: 5
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 80.0
    raw_ph:
      channel: 6
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 14.0
flow_estimation:
  pump_pressure:
    pressure_scale_psi: 0.4335
    c_dynamic: 0.00525
    c_no_flow_low: 22.25
    c_no_flow_high: 93.5
  branch_pressure:
    return_flow:
      a: 0.0
      b: 1.0
    bubbler_flow:
      a: 0.0
      b: 1.0
    booster_flow:
      a: 0.0
      b: 1.0
  filter_restriction:
    clean_value: 2.0
    dirty_value: 8.0
weather:
  enabled: true
  latitude: 32.9949
  longitude: -96.8995
  poll_interval_s: 3600
  past_hours: 2
  forecast_hours: 48
  request_timeout_s: 15
  temperature_unit: fahrenheit
  wind_speed_unit: mph
  precipitation_unit: inch
  source: open-meteo
  endpoint: https://api.open-meteo.com/v1/forecast
