runtime:
  driver_profile: simulated
  enabled_actuators:
  - pump_motor
  - pump_motor_speed
  - booster_pump
  - chlorine_dosing_pump
  enabled_sensor_groups:
  - pressures
  - chemistry_loop
  - chemical_tank
site:
  timezone: America/Chicago
  latitude: 45.0
  longitude: -90.0
pool:
  name: Home Pool
  volume_gal: 10000.0
pump_timer:
  active_profile: normal
  profiles:
  - name: normal
    schedules:
    - name: morning_dosing
      enabled: true
      timing:
        type: fixed
        start: '08:00'
        end: '12:00'
      pump_speed: low
      booster: 'off'
      allow_dosing: true
    - name: afternoon_low
      enabled: true
      timing:
        type: solar_anchor
        anchor: sunset
        offset_minutes: -180
        duration_minutes: 180
      pump_speed: low
      booster: 'off'
      allow_dosing: false
    - name: sunset_high
      enabled: true
      timing:
        type: solar_anchor
        anchor: sunset
        offset_minutes: 0
        duration_minutes: 60
      pump_speed: high
      booster: 'off'
      allow_dosing: false
    - name: night_vacuum
      enabled: true
      timing:
        type: fixed
        start: '22:00'
        end: '23:00'
      pump_speed: low
      booster: 'on'
      allow_dosing: false
chlorination:
  enabled: true
  daily_dose_oz: 96.0
  pump_output_oz_per_min: 1.0
  chlorine_strength_percent: 12.0
  no_dose_first_minutes: 1.0
  no_dose_last_minutes: 10.0
  max_duty_cycle: 0.5
  cycle_on_seconds: 60.0
  max_cycle_period_seconds: 1800.0
  min_cycle_on_seconds: 5.0
fc_demand:
  enabled: true
  mode: observe_only
  target_fc_ppm: 4.0
  minimum_test_interval_hours: 12.0
  max_observation_interval_days: 7.0
  preferred_test_start_hour: 18
  preferred_test_end_hour: 24
  negative_demand_noise_tolerance_ppm_per_day: 0.05
  recent_observation_count: 5
  observation_weights:
  - 0.35
  - 0.25
  - 0.18
  - 0.13
  - 0.09
  fc_feedback_gain: 0.6
  max_maintenance_change_percent: 15.0
  max_daily_dose_oz: 256.0
safety:
  pressure_sensor_ids:
    pump_output: pump_output_psi
  freeze_protection:
    enabled: true
    primary_temperature_sensor: ph_temp
    fallback_temperature_sensor: orp_temp
    max_temperature_age_seconds: 3600
    low_speed_on_below_temp: 35
    low_speed_off_above_temp: 37
    high_speed_on_below_temp: 33
    high_speed_off_above_temp: 34
    min_run_seconds: 600
    threshold_unit: degF
  chlorine_tank:
    level_sensor: chlorine_tank_level_gal
    low_warning_gal: 2.0
    inhibit_below_gal: 1.5
    reenable_at_gal: 2.0
  thresholds:
    chlorine_min_pump_output_psi: 3
    chlorine_max_pump_output_psi: 4.2
    pump_prime_min_output_psi: 1
    pump_output_overpressure_psi: 30
  timeouts:
    pump_output_max_age_seconds: 10
    pump_prime_timeout_s: 30
logging:
  database_path: data\windows-dev.sqlite3
  control_measurement_interval_s: 30.0
notifications:
  enabled: false
  provider: pushover
  default_title: PoolScope
  pushover:
    app_token_env: PUSHOVER_APP_TOKEN
    user_key_env: PUSHOVER_USER_KEY
    api_url: https://api.pushover.net/1/messages.json
    timeout_s: 5.0
    priority: 0
    sound: null
  rules:
    chlorine_tank_days_remaining:
      enabled: false
      notify_caution: true
      notify_alarm: true
      caution_repeat_minutes: 1440.0
      alarm_repeat_minutes: 240.0
    raw_ph:
      enabled: false
      notify_caution: true
      notify_alarm: true
      caution_repeat_minutes: 1440.0
      alarm_repeat_minutes: 240.0
    raw_orp:
      enabled: false
      notify_caution: true
      notify_alarm: true
      caution_repeat_minutes: 1440.0
      alarm_repeat_minutes: 240.0
    filter_flow_loss_percent:
      enabled: false
      notify_caution: false
      notify_alarm: true
      caution_repeat_minutes: 1440.0
      alarm_repeat_minutes: 1440.0
    freeze_temperature_unavailable:
      enabled: true
      notify_caution: false
      notify_alarm: true
      caution_repeat_minutes: 1440.0
      alarm_repeat_minutes: 240.0
acquisition:
  groups:
    pressures:
      sensor_ids:
      - pump_output_psi
      read_interval_s: 0.5
      log_interval_s: 30
      requires_pump_flow: false
      min_pump_on_seconds: 0
      required_pump_speed: null
      oversample:
        sample_count: 1
        sample_interval_s: 0
        reducer: last
      filter:
        type: boxcar
        window_samples: 2
        window_seconds: null
        min_samples: 1
    chemistry_loop:
      sensor_ids:
      - raw_orp
      - orp_temp
      - raw_ph
      - ph_temp
      - temp
      read_interval_s: 5
      log_interval_s: 120
      requires_pump_flow: true
      min_pump_on_seconds: 60
      required_pump_speed: null
      oversample:
        sample_count: 1
        sample_interval_s: 0
        reducer: last
      filter:
        type: boxcar
        window_samples: null
        window_seconds: 60
        min_samples: 1
    chemical_tank:
      sensor_ids:
      - tank_level
      read_interval_s: 30
      log_interval_s: 300
      requires_pump_flow: false
      min_pump_on_seconds: 0
      required_pump_speed: null
      oversample:
        sample_count: 1
        sample_interval_s: 0
        reducer: last
      filter:
        type: boxcar
        window_samples: 3
        window_seconds: null
        min_samples: 1
  chemistry_sampling_refresh:
    enabled: true
    max_pump_off_s: 3600
    run_duration_s: 90
    pump_speed: high
monitoring:
  limits:
    pump_output_psi:
      alarm_below: 0.0
      caution_below: 0.0
      caution_above: 25.0
      alarm_above: 30.0
    raw_orp:
      alarm_below: 400.0
      caution_below: 600.0
      caution_above: 800.0
      alarm_above: 900.0
    orp_temp:
      alarm_below: 35.0
      caution_below: 65.0
      caution_above: 90.0
      alarm_above: 100.0
    raw_ph:
      alarm_below: 6.8
      caution_below: 7.2
      caution_above: 7.8
      alarm_above: 8.2
    ph_temp:
      alarm_below: 35.0
      caution_below: 65.0
      caution_above: 90.0
      alarm_above: 100.0
    temp:
      alarm_below: 35.0
      caution_below: 65.0
      caution_above: 90.0
      alarm_above: 100.0
    tank_level:
      alarm_below: 5.0
      caution_below: 20.0
      caution_above: 100.0
      alarm_above: 100.0
    calcium_saturation_index:
      alarm_below: -0.6
      caution_below: -0.3
      caution_above: 0.3
      alarm_above: 0.6
    filter_flow_loss_percent:
      caution_above: 10.0
      alarm_above: 15.0
    chlorine_tank_days_remaining:
      alarm_below: 3.0
      caution_below: 7.0
    cpu_temp:
      alarm_below: 0.0
      caution_below: 0.0
      caution_above: 70.0
      alarm_above: 80.0
    cpu_load_percent:
      alarm_below: 0.0
      caution_below: 0.0
      caution_above: 75.0
      alarm_above: 90.0
calcium_saturation_index:
  enabled: true
  temp_sensor_id: water_temp
  ph_sensor_id: raw_ph
modbus_analog_input:
  port: COM3
  slave_id: 4
  baudrate: 9600
  timeout_s: 1.0
  raw_to_volts_scale: 0.0005
  raw_to_volts_offset: 0.0
  sensors:
    pump_output_psi:
      channel: 1
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 30.0
flow_estimation:
  pump_pressure:
    pressure_scale_psi: 0.4335
    c_dynamic: 0.00525
    c_suction: 0.00035
    c_no_flow_low: 22.25
    c_no_flow_high: 93.5
filter_loading:
  enabled: true
  clean_flow_gpm: null
  stabilization_seconds: 60
  averaging_seconds: 120
  max_pressure_age_seconds: 10
weather:
  enabled: false
  poll_interval_s: 3600
  past_hours: 2
  forecast_hours: 48
  request_timeout_s: 15
  temperature_unit: fahrenheit
  wind_speed_unit: mph
  precipitation_unit: inch
  source: open-meteo
  endpoint: https://api.open-meteo.com/v1/forecast
