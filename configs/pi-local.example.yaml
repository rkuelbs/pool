# Copy this file to configs/pi-local.yaml on the Raspberry Pi. The local file
# is ignored by git and is merged over pi-prod.yaml. This template intentionally
# has no active overrides, so copying it as-is preserves tracked production
# defaults.
#
# Add only values that are truly site-specific. Common examples:
#
# site:
#   timezone: America/Chicago
#   latitude: <replace tracked 45.0 demo latitude with the real site>
#   longitude: <replace tracked -90.0 demo longitude with the real site>
#
# pool:
#   name: Home Pool
#   volume_gal: <measured pool volume>
#
# pump_timer:
#   active_profile: normal
#   profiles:
#     - name: normal
#       schedules:
#         - name: site_schedule_name
#           enabled: true
#           timing:
#             type: solar_anchor
#             anchor: sunrise
#             offset_minutes: 30
#             duration_minutes: 240
#           pump_speed: low
#           booster: off
#           allow_dosing: true
#
# IMPORTANT: YAML list overrides replace the entire base list. Defining
# pump_timer.profiles here replaces every profile in pi-prod.yaml, so include
# the site's complete profiles and an explicit allow_dosing value per event.
#
# chlorination:
#   pump_output_oz_per_min: <measured calibration>
#   chlorine_strength_percent: <sodium hypochlorite concentration>
#   daily_dose_oz: <site value, if manually controlled>
#
# fc_demand:
#   target_fc_ppm: <site target>
#   mode: observe_only  # use automatic only after validation
#   max_daily_dose_oz: <site safety cap>
#
# filter_loading:
#   clean_flow_gpm: <Qclean measured just after filter cleaning>
#
# monitoring:
#   limits:
#     raw_ph:
#       alarm_below: 6.8
#       caution_below: 7.2
#       caution_above: 7.8
#       alarm_above: 8.2
#     filter_flow_loss_percent:
#       caution_above: 10
#       alarm_above: 15
#
# weather:
#   enabled: true  # coordinates come from the shared site block
#
# Hardware paths/slave IDs belong here only when they differ from pi-prod.yaml,
# for example modbus_rtu.port, modbus_*_sensor.slave_id, or GPIO mappings.
#
# Notification secrets should remain in environment variables or the existing
# protected secret source. Local YAML may enable notifications and choose the
# environment-variable names, but should not contain Pushover token/key values.
#
# Older ownership keys remain readable and are normalized safely, but new edits
# should use only the canonical locations documented above. Saving through
# Settings writes canonical keys and removes migrated duplicates.

