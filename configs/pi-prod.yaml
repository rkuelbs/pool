runtime:
  stage: open_loop_timer
  driver_profile: raspberry_pi
  enabled_layers:
    - pump_timer
    - safety_enforcement
  enabled_actuators:
    - pump_motor
    - pump_motor_speed
    - booster_pump
  enabled_sensor_groups: []

pump_timer:
  timezone: America/Chicago
  schedules:
    - name: morning_filter
      start: "08:00"
      end: "12:00"
      pump_speed: high
      booster: off

    - name: afternoon_filter
      start: "15:00"
      end: "18:00"
      pump_speed: low
      booster: off

modbus_relay:
  port: /dev/ttyUSB0
  slave_id: 1
  baudrate: 9600
  timeout_s: 1.0

  relays:
    pump_motor: 1
    pump_motor_speed: 2
    booster_pump: 3
    chlorine_dosing_pump: 4

  pump_speed_relay:
    low_state: on
    high_state: off

modbus_orp_sensor:
  port: /dev/ttyUSB0
  slave_id: 3
  baudrate: 9600
  timeout_s: 1.0

modbus_analog_input:
  port: /dev/ttyUSB0
  slave_id: 4
  baudrate: 9600
  timeout_s: 1.0
  raw_to_volts_scale: 0.001
  raw_to_volts_offset: 0.0
  sensors:
    pump_output_psi:
      channel: 1
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 30.0
    filter_output_psi:
      channel: 2
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 30.0
    return_psi:
      channel: 3
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 20.0
    bubbler_psi:
      channel: 4
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 20.0
    booster_psi:
      channel: 5
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 80.0
    raw_ph:
      channel: 6
      calibration:
        voltage_1: 0.0
        value_1: 0.0
        voltage_2: 5.0
        value_2: 14.0

safety:
  pressure_sensor_ids:
    pump_output: pump_output_psi
    return_line: return_psi
    booster: booster_psi
  freeze_protection:
    enabled: false
    source: temp
    temp_sensor: temp
    ph_temp_sensor: orp_temp
    low_speed_on_below_temp: 35.0
    low_speed_off_above_temp: 37.0
    high_speed_on_below_temp: 33.0
    high_speed_off_above_temp: 34.0
    min_run_seconds: 600.0
    threshold_unit: degF

  thresholds:
    chlorine_min_return_psi: 2.0
    chlorine_min_pump_output_psi: 6.0
    booster_max_psi: 60.0
    booster_min_psi: 30.0
    pump_low_prime_min_output_psi: 1.0
    pump_output_overpressure_psi: 30.0
    pump_high_prime_min_output_psi: 5.0

  timeouts:
    booster_low_pressure_grace_s: 10.0
    pump_low_prime_seconds: 30.0
    pump_high_prime_timeout_s: 30.0

logging:
  database_path: data/pi-prod.sqlite3
mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  keepalive_s: 30
  client_id: poolctl-pi
  topic_prefix: poolctl
  command_topic: command/set
  lab_test_topic: lab_test/add
  publish_live_topic: telemetry/live
  publish_health_topic: telemetry/health
  qos: 0
  retain: false
  publish_live: true
  publish_health: true
  allow_remote_commands: false
  allow_remote_lab_tests: true

acquisition:
  chemistry_sampling_refresh:
    enabled: true
    max_pump_off_s: 21600.0
    run_duration_s: 1200.0
    pump_speed: high
  groups:
    pressures:
      sensor_ids:
        - pump_output_psi
        - filter_output_psi
        - return_psi
        - bubbler_psi
        - booster_psi
      read_interval_s: 0.5
      log_interval_s: 30.0
      requires_pump_flow: false
      oversample:
        sample_count: 3
        sample_interval_s: 0.0
        reducer: median

    chemistry_loop:
      sensor_ids:
        - raw_orp
        - orp_temp
        - raw_ph
        - raw_ph_voltage
        - temp
      read_interval_s: 5.0
      log_interval_s: 120.0
      requires_pump_flow: true
      min_pump_on_seconds: 60.0
      oversample:
        sample_count: 10
        sample_interval_s: 0.1
        reducer: median

    chemical_tank:
      sensor_ids:
        - tank_level
      read_interval_s: 30.0
      log_interval_s: 300.0
      requires_pump_flow: false
      oversample:
        sample_count: 3
        sample_interval_s: 0.0
        reducer: median

live_view:
  sensor_limits:
    pump_output_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 25.0
      caution_max: 30.0
    filter_output_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 25.0
      caution_max: 30.0
    return_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 18.0
      caution_max: 25.0
    bubbler_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 18.0
      caution_max: 25.0
    booster_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 55.0
      caution_max: 60.0
    raw_orp:
      caution_min: 400.0
      normal_min: 600.0
      normal_max: 800.0
      caution_max: 900.0
    orp_temp:
      caution_min: 2.0
      normal_min: 18.0
      normal_max: 32.0
      caution_max: 40.0
    raw_ph:
      caution_min: 6.8
      normal_min: 7.2
      normal_max: 7.8
      caution_max: 8.2
    raw_ph_voltage:
      caution_min: 0.0
      normal_min: 0.2
      normal_max: 4.8
      caution_max: 5.0
    temp:
      caution_min: 2.0
      normal_min: 18.0
      normal_max: 32.0
      caution_max: 40.0
    tank_level:
      caution_min: 5.0
      normal_min: 20.0
      normal_max: 100.0
      caution_max: 100.0
