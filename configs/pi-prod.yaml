runtime:
  driver_profile: raspberry_pi
  enabled_actuators:
  - pump_motor
  - pump_motor_speed
  - booster_pump
  - chlorine_dosing_pump
  enabled_sensor_groups:
  - pressures
  - chemistry_loop
pump_timer:
  timezone: America/Chicago
  schedules:
  - name: morning_dosing
    start: '07:00'
    end: '09:00'
    pump_speed: low
    booster: 'off'
    allow_dosing: true
  - name: midday_dosing
    start: '10:30'
    end: '14:00'
    pump_speed: low
    booster: 'off'
    allow_dosing: true
  - name: afternoon_circulation
    start: '15:30'
    end: '17:00'
    pump_speed: low
    booster: 'off'
    allow_dosing: false
  - name: evening_vacuum
    start: '21:00'
    end: '22:00'
    pump_speed: low
    booster: 'on'
    allow_dosing: false
modbus_relay:
  port: /dev/ttyUSB0
  slave_id: 3
  baudrate: 4800
  timeout_s: 1.0
  dosing_uses_flash: true
  startup_safe_off: true
  reconciliation_interval_s: 30.0
  relays:
    pump_motor: 1
    pump_motor_speed: 2
    booster_pump: 3
    chlorine_dosing_pump: 7
  pump_speed_relay:
    low_state: true
    high_state: false
modbus_orp_sensor:
  port: /dev/ttyUSB0
  slave_id: 1
  baudrate: 4800
  timeout_s: 1.0
  circuit_breaker:
    enabled: true
    failure_threshold: 2
    cooldown_s: 60
enable_modbus_ph_sensor: true
modbus_ph_sensor:
  port: /dev/ttyUSB0
  slave_id: 4
  baudrate: 4800
  timeout_s: 1.0
  circuit_breaker:
    enabled: true
    failure_threshold: 2
    cooldown_s: 60
modbus_analog_input:
  port: /dev/ttyUSB0
  slave_id: 2
  baudrate: 4800
  timeout_s: 1
  raw_to_volts_scale: 0.001
  raw_to_volts_offset: 0
  startup_channel_mode: 0
  sensors:
    pump_output_psi:
      channel: 5
      calibration:
        voltage_1: 0.34
        value_1: 0
        voltage_2: 4.34
        value_2: 30
flow_estimation:
  pump_pressure:
    pressure_scale_psi: 0.4335
    c_dynamic: 0.00525
    c_suction: 0.00035
    c_no_flow_low: 23.75
    c_no_flow_high: 95
filter_loading:
  enabled: true
  clean_flow_gpm: null
  yellow_flow_loss_percent: 10.0
  red_flow_loss_percent: 15.0
  stabilization_seconds: 60
  averaging_seconds: 120
  max_pressure_age_seconds: 10
chlorination:
  enabled: true
  daily_dose_oz: 0
  pump_output_oz_per_min: 1.72
  no_dose_first_minutes: 1.0
  no_dose_last_minutes: 10.0
  max_duty_cycle: 0.5
  cycle_on_seconds: 60.0
  max_cycle_period_seconds: 1800.0
  min_cycle_on_seconds: 30.0
fc_demand:
  enabled: true
  mode: observe_only
  pool_volume_gal: 16000.0
  target_fc_ppm: 4.5
  chlorine_strength_percent: 12.0
  minimum_test_interval_hours: 12.0
  max_observation_interval_days: 7.0
  preferred_test_start_hour: 18
  preferred_test_end_hour: 24
  negative_demand_noise_tolerance_ppm_per_day: 0.05
  recent_observation_count: 5
  observation_weights:
  - 0.35
  - 0.25
  - 0.18
  - 0.13
  - 0.09
  fc_feedback_gain: 0.6
  max_maintenance_change_percent: 15.0
  max_daily_dose_oz: 120.0
safety:
  pressure_sensor_ids:
    pump_output: pump_output_psi
  freeze_protection:
    enabled: true
    primary_temperature_sensor: ph_temp
    fallback_temperature_sensor: orp_temp
    max_temperature_age_seconds: 3600
    low_speed_on_below_temp: 35
    low_speed_off_above_temp: 37
    high_speed_on_below_temp: 33
    high_speed_off_above_temp: 34
    min_run_seconds: 600
    threshold_unit: degF
  chlorine_tank:
    level_sensor: chlorine_tank_level_gal
    low_warning_gal: 2.0
    inhibit_below_gal: 1.5
    reenable_at_gal: 2.0
    forecast_reserve_gal: 2.0
  thresholds:
    chlorine_min_pump_output_psi: 3
    chlorine_max_pump_output_psi: 3.5
    pump_prime_min_output_psi: 1
    pump_output_overpressure_psi: 30
  timeouts:
    pump_output_max_age_seconds: 10
    pump_prime_timeout_s: 30
logging:
  database_path: data/pi-prod.sqlite3
  control_measurement_interval_s: 30.0
notifications:
  enabled: false
  provider: pushover
  default_title: poolctl
  pushover:
    app_token_env: PUSHOVER_APP_TOKEN
    user_key_env: PUSHOVER_USER_KEY
    api_url: https://api.pushover.net/1/messages.json
    timeout_s: 5.0
    priority: 0
    sound: null
  alerts:
    chlorine_tank:
      enabled: false
      caution_below: 7.0
      warning_below: 3.0
      caution_repeat_minutes: 1440.0
      warning_repeat_minutes: 240.0
    ph:
      enabled: false
      caution_below: 7.2
      caution_above: 7.8
      warning_below: 6.8
      warning_above: 8.2
      caution_repeat_minutes: 1440.0
      warning_repeat_minutes: 240.0
    orp:
      enabled: false
      caution_below: 600.0
      caution_above: 800.0
      warning_below: 400.0
      warning_above: 900.0
      caution_repeat_minutes: 1440.0
      warning_repeat_minutes: 240.0
    filter_flow_loss:
      enabled: false
      warning_above: 15.0
      warning_repeat_minutes: 1440.0
    freeze_temperature_unavailable:
      enabled: true
      warning_repeat_minutes: 240.0
acquisition:
  groups:
    pressures:
      sensor_ids:
      - pump_output_psi
      - cpu_temp
      - cpu_load_percent
      - cpu_fan_rpm
      read_interval_s: 1
      log_interval_s: 60
      requires_pump_flow: false
      min_pump_on_seconds: 0
      required_pump_speed: null
      oversample:
        sample_count: 1
        sample_interval_s: 0
        reducer: last
      filter:
        type: boxcar
        window_samples: 5
        window_seconds: null
        min_samples: 1
    chemistry_loop:
      sensor_ids:
      - raw_orp
      - orp_temp
      - raw_ph
      - ph_temp
      read_interval_s: 10
      log_interval_s: 60
      requires_pump_flow: true
      min_pump_on_seconds: 300
      required_pump_speed: null
      oversample:
        sample_count: 1
        sample_interval_s: 0
        reducer: last
      filter:
        type: boxcar
        window_samples: null
        window_seconds: 60
        min_samples: 1
  chemistry_sampling_refresh:
    enabled: true
    max_pump_off_s: 3000
    run_duration_s: 600
    pump_speed: low
live_view:
  sensor_limits:
    pump_output_psi:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 25.0
      caution_max: 30.0
    raw_orp:
      caution_min: 400.0
      normal_min: 600.0
      normal_max: 800.0
      caution_max: 900.0
    orp_temp:
      caution_min: 35.0
      normal_min: 65.0
      normal_max: 90.0
      caution_max: 100.0
    raw_ph:
      caution_min: 6.8
      normal_min: 7.2
      normal_max: 7.8
      caution_max: 8.2
    ph_temp:
      caution_min: 35.0
      normal_min: 65.0
      normal_max: 90.0
      caution_max: 100.0
    cpu_temp:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 70.0
      caution_max: 80.0
    cpu_load_percent:
      caution_min: 0.0
      normal_min: 0.0
      normal_max: 75.0
      caution_max: 90.0
    calcium_saturation_index:
      caution_min: -0.6
      normal_min: -0.3
      normal_max: 0.3
      caution_max: 0.6
calcium_saturation_index:
  enabled: true
  temp_sensor_id: water_temp
  ph_sensor_id: raw_ph
weather:
  enabled: false
  latitude: null
  longitude: null
  poll_interval_s: 3600
  past_hours: 2
  forecast_hours: 48
  request_timeout_s: 15
  temperature_unit: fahrenheit
  wind_speed_unit: mph
  precipitation_unit: inch
  source: open-meteo
  endpoint: https://api.open-meteo.com/v1/forecast
